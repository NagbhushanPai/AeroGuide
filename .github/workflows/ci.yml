name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, unit, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  api:
    name: API (lint, types, tests with Postgres+PostGIS and Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: aeroguide
          POSTGRES_PASSWORD: aeroguide
          POSTGRES_DB: aeroguide
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aeroguide -d aeroguide"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://aeroguide:aeroguide@localhost:5432/aeroguide
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The postgis image pre-enables extras we don't use (Supabase doesn't have them);
      # remove them so migrations own extension setup, as in production.
      - name: Remove image-provided extensions
        env:
          PGPASSWORD: aeroguide
        run: >-
          psql -h localhost -U aeroguide -d aeroguide -v ON_ERROR_STOP=1 -c
          "DROP EXTENSION IF EXISTS postgis_tiger_geocoder, postgis_topology, fuzzystrmatch, postgis CASCADE"
      - run: uv run alembic upgrade head
      - run: uv run pytest --integration

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
