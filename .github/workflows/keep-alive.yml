# Keeps the free-tier database awake: Supabase pauses a free project after 7 days without
# activity, and a quiet fortnight would take every content page down. Runs one read-only
# query twice a week. Does nothing until the repository secret DATABASE_URL is set.
name: Database keep-alive

on:
  schedule:
    - cron: "17 4 * * 1,4" # Mondays and Thursdays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Ping the database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret not set; nothing to keep awake."
            exit 0
          fi
          uv sync --frozen --no-dev
          uv run --no-dev python -m app.jobs.ping_db
