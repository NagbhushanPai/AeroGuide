[project]
name = "aeroguide-api"
version = "0.1.0"
description = "AeroGuide API: airports, lounges, cards, eligibility and live flight data (open sources)"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "asyncpg>=0.32,<0.33",
  "alembic>=1.20,<2",
  "geoalchemy2>=0.21,<0.22",
  "redis>=8.1,<9",
  "httpx>=0.28,<0.29",
  "pyyaml>=6.0.2,<7",
  "mcp>=1,<2",
]

[dependency-groups]
dev = [
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
  "pytest>=9.2,<10",
  "pytest-asyncio>=1.5,<2",
  "types-pyyaml>=6.0",
  "hypothesis>=6.120,<7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]   # assert is how pytest works; raw fixture data can be long
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs running Postgres+PostGIS and Redis (enable with --integration)"]
