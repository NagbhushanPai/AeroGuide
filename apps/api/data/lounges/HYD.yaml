  - program: encalm-paid
    valid_from: 2026-11-14
    paid_price: 2550
    currency: INR
    paid_duration_min: 120
    provenance:
      status: verified
      source: encalm-lounge-page
      verified_at: 2026-11-14
      verified_by: claude-code
      notes: 'Ambiguous on the source. Operator page gives category pricing, not a per-lounge price: ''Domestic
        departure lounges: INR 2550 including tax for access up to 2 hours'' (children 6-11: INR 1800).
        The page lists the Hyderabad domestic lounge under that category. Walk-in: ''payment can be conveniently
        made at the entrance of the respective lounge''. ''Terms & Conditions Apply''.'
