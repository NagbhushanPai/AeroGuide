    program: hdfc-bank-lounge-access
    note: List of participating lounges may change basis various factors such as closures, change in service
      provider or at the discretion of bank.
  - type: entry_method
    method: card_swipe
    note: Primary or add on card holder ... should present their respective cards at the lounge.
  - type: add_on_cardholders
    covered: true
    note: Lounge access is available to Primary & Add on Card holders. The shared benefit count does not
      apply when lounge access is unlimited.
  - type: guest_allowance
