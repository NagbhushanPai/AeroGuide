- scope: international
  valid_from: 2026-11-14
  summary: Unlimited complimentary international lounge access for primary and add-on cardholders via
    Priority Pass, with no minimum spend requirement; guests are charged USD 35 per person per visit.
  rules:
  - type: program_entitlement
    program: priority-pass
  - type: entry_method
    method: card_swipe
    note: '"Present your Credit Card / Digital QR code available on the Priority Pass app"; no separate
